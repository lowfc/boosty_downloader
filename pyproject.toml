[project]
name = "boosty_downloader"
version = "3.1.0"
description = "App for download boosty content"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Rowdy Beaver", email = "lowfc@mail.ru" }
]
dependencies = [
  "aiofiles>=25.1.0",
  "aiohttp>=3.13.3",
  "flet>=1.0.0",
  "pyinstaller>=6.18.0",
  "screeninfo>=0.8.1",
]

[dependency-groups]
dev = [
  "flet[all]>=1.0.0",
]

[tool.flet]
org = "lowfc"
product = "boosty_downloader"
company = "lowfc"
copyright = "MiT License"

[tool.flet.app]
path = "src"

[tool.flet.macos.cleanup]
# PyObjC tests and debug symbols are not needed at runtime. Xcode's resource
# copy phase tries to strip the DWARF files in .dSYM bundles and fails.
package_files = ["PyObjCTest", "**/*.dSYM"]
